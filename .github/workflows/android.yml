name: Android verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable debug keystore
        run: base64 --decode keystore/debug.keystore.base64 > keystore/debug.keystore

      - name: Verify debug build
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Verify stable debug certificate
        run: |
          CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$CERTS"
          echo "$CERTS" | grep -F "Signer #1 certificate SHA-256 digest: f805690fd2b6a9e925d6da491fbbb2839df7df581db580f58eb7f26742804c7a"

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
          if-no-files-found: warn
